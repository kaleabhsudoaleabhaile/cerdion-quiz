<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CerdionQuiz</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding-bottom: 90px; }
    header { background: #1e1b4b; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6366f1; }
    .logo { font-size: 22px; font-weight: bold; color: #38bdf8; }
    .logo span { background: #6366f1; color: white; padding: 2px 8px; border-radius: 6px; font-size: 15px; }
    .container { padding: 15px; max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .btn { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 14px; text-align: center; }
    .btn-telegram { background: #0088cc; text-decoration: none; display: block; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
    label { font-size: 13px; color: #cbd5e1; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #334155; z-index: 100; }
    .nav-item { color: #94a3b8; font-size: 11px; text-align: center; cursor: pointer; flex: 1; }
    .nav-item.active { color: #38bdf8; font-weight: bold; }
    .page { display: none; }
    .page.active { display: block; }
    .user-card { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
  </style>
</head>
<body>

  <header>
    <div class="logo">CerdionQuiz <span>K Y</span></div>
    <div onclick="openAdmin()" style="cursor:pointer; font-size:20px;">⚙️</div>
  </header>

  <div class="container">
    
    <!-- HOME PAGE -->
    <div id="homePage" class="page active">
      <div class="card">
        <h3>CerdionQuiz እንኳን ደጡ</h3>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">
          5 ጥያቄዎችን በመመለስ 300 ብር ያሸንፉ! የመግቢያ ሂሳብ 20 ETB።
        </p>
        <button class="btn" onclick="switchPage('realAccountPage')">የእውነተኛ አካውንት (Deposit/Withdraw)</button>
      </div>
    </div>

    <!-- REAL ACCOUNT PAGE -->
    <div id="realAccountPage" class="page">
      <div class="card">
        <h3>Deposit (ብር ማስገቢያ)</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">
          • Telebirr: 0985625604<br>
          • ስም: Kaleab Haile W/abrha
        </p>
        <form onsubmit="submitDeposit(event)">
          <label>ሙሉ ስምዎ</label>
          <input type="text" id="depName" placeholder="ስምዎን ያስገቡ" required>
          <label>የብር መጠን (በ 20 እጥፍ)</label>
          <input type="number" id="depAmount" step="20" min="20" placeholder="20, 40, 60..." required>
          <button class="btn" type="submit">መረጃ መዝግብ</button>
        </form>

        <div id="tgLinkBox" style="display:none; margin-top:15px; text-align:center;">
          <a id="tgAnchor" href="#" target="_blank" class="btn btn-telegram">📲 ቴሌግራም ላይ አድሚን ጋር ላክ (@CerdionQuiz_Admin)</a>
        </div>
      </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanelPage" class="page">
      <div class="card">
        <h3 style="color: #ef4444;">⚙️ Admin Control Panel</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">የመመዝገቢያ ጥያቄዎች ዝርዝር፦</p>
        <div id="adminRequestsList">
          <p style="font-size: 12px; color: #64748b;">ጥያቄዎችን በመጫን ላይ...</p>
        </div>
      </div>
    </div>

  </div>

  <div class="nav">
    <div class="nav-item active" onclick="switchPage('homePage')">🏠 መነሻ</div>
    <div class="nav-item" onclick="switchPage('realAccountPage')">🟢 አካውንት</div>
  </div>

  <script>
    const adminUsername = "CerdionQuiz_Admin";

    const firebaseConfig = {
      apiKey: "AIzaSyCFBuMejhBpPeC6KDe...",
      authDomain: "cerdionquiz.firebaseapp.com",
      databaseURL: "https://cerdionquiz-default-rtdb.firebaseio.com",
      projectId: "cerdionquiz",
      storageBucket: "cerdionquiz.appspot.com",
      messagingSenderId: "11951685719",
      appId: "1:11951685719:web:4333366...",
      measurementId: "G-4VVZT67XEC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function openAdmin() {
      let pass = prompt("የአድሚን የይለፍ ቃል ያስገቡ:");
      if (pass === "182418") {
        switchPage('adminPanelPage');
        loadAdminRequests();
      } else if (pass !== null) {
        alert("የተሳሳተ የይለፍ ቃል!");
      }
    }

    function submitDeposit(e) {
      e.preventDefault();
      let name = document.getElementById('depName').value.trim();
      let amount = document.getElementById('depAmount').value;

      let reqId = 'dep_' + Date.now();
      db.ref('depositRequests/' + reqId).set({
        id: reqId,
        name: name,
        amount: amount,
        date: new Date().toLocaleDateString(),
        status: 'pending'
      }).then(() => {
        let textMsg = encodeURIComponent(`ሰላም አድሚን CerdionQuiz!\n\n📌 አዲስ የዴፖዚት መረጃ፦\n• ስም፦ ${name}\n• መጠን፦ ${amount} ETB\n\nእባክዎ አካውንቴን ያረጋግጡልኝ!`);
        let tgUrl = `https://t.me/${adminUsername}?text=${textMsg}`;
        
        let anchor = document.getElementById('tgAnchor');
        anchor.href = tgUrl;
        document.getElementById('tgLinkBox').style.display = 'block';

        alert('መረጃው ተመዝግቧል! አሁን ከታች የመጣውን አረንጓዴ የቴሌግራም ቁልፍ ይጫኑ።');
      }).catch(err => {
        alert('ስህተት አጋጥሟል: ' + err.message);
      });
    }

    function loadAdminRequests() {
      let container = document.getElementById('adminRequestsList');
      db.ref('depositRequests').on('value', (snapshot) => {
        let data = snapshot.val();
        if (!data) {
          container.innerHTML = '<p style="font-size: 12px; color: #64748b;">ምንም ጥያቄ የለም።</p>';
          return;
        }
        container.innerHTML = '';
        Object.values(data).forEach(req => {
          let div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `
            <b>ስም:</b> ${req.name}<br>
            <b>መጠን:</b> ${req.amount} ETB<br>
            <b>ቀን:</b> ${req.date}<br>
            <button onclick="deleteReq('${req.id}')" style="background:#dc2626; color:white; border:none; padding:4px 8px; border-radius:4px; margin-top:6px; cursor:pointer;">አጥፋ</button>
          `;
          container.appendChild(div);
        });
      });
    }

    function deleteReq(id) {
      if(confirm('ማጥፋት ይፈልጋሉ?')) {
        db.ref('depositRequests/' + id).remove();
      }
    }
  </script>
</body>
</html>
